// BlenderMC. Inside D:\JAVAMODS it is a subproject of the Echo World build (shared Gradle home, Minecraft jars and
// Loom cache); cloned on its own, settings.gradle and gradle.properties here make it a build by itself.
plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

version = project.mod_version
group = "dev.blendermc"

base {
	archivesName = "blendermc"
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"blendermc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Named "liminalClient" so `gradlew runClient` at the root keeps starting Echo World only;
		// this one is `gradlew runLiminalClient` (or `:blendermc:runLiminalClient`).
		client {
			ideConfigGenerated = false
		}
		server {
			ideConfigGenerated = false
		}
		liminalClient {
			client()
			configName = "BlenderMC Client"
			runDir = "run"
			vmArg "-Xmx3G"
			vmArg "-Djava.io.tmpdir=${rootProject.file('.tmp').absolutePath}"
			// -PquickPlay=<world folder>: open that world straight away.
			if (project.hasProperty("quickPlay")) {
				programArgs "--quickPlaySingleplayer", project.property("quickPlay").toString()
			}
		}
		// Headless server for testing the Blender live link without a game window: `gradlew runLiminalServer`.
		liminalServer {
			server()
			configName = "BlenderMC Server"
			runDir = project.relativePath(rootProject.file(".tmp/liminal-server"))
			ideConfigGenerated = false
			vmArg "-Djava.io.tmpdir=${rootProject.file('.tmp').absolutePath}"
		}
	}
}

// Loom always adds the client/server runs; switched off so a root `runClient` does not open a second game.
tasks.matching { it.name in ["runClient", "runServer", "runClientRenderDoc"] }.configureEach {
	enabled = false
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Dev-only mods: present in runLiminalClient, never bundled into the released jar.
	modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	if (project.dev_sodium.toBoolean()) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
}

// src/test only holds dev tools (no unit tests yet), so an empty test run is fine.
tasks.named("test") {
	failOnNoDiscoveredTests = false
}

// Dev tool: what a liminal .glb loads as, plus a walk from its spawn. -Pglb=path[;path...]
tasks.register("glbCheck", JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.blendermc.tools.GlbCheck"
	jvmArgs "-Djava.io.tmpdir=${rootProject.file('.tmp').absolutePath}", "-Djava.awt.headless=true"
	args = (project.findProperty("glb") ?: "").toString().split(";").toList()
}

// Dev tool: counts the stone cut faces of a liminal level (nothing dug / one cell dug). -Pglb=path
tasks.register("cutCheck", JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.blendermc.tools.CutCheck"
	jvmArgs "-Djava.io.tmpdir=${rootProject.file('.tmp').absolutePath}", "-Djava.awt.headless=true"
	args = [(project.findProperty("glb") ?: "").toString()]
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Dev tool: builds a level from per-object .glb files like the Blender live link and compares it with a reference .glb.
// -Pdir=folder -Pref=reference.glb
tasks.register("liveSceneCheck", JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.blendermc.live.LiveSceneCheck"
	jvmArgs "-Djava.io.tmpdir=${rootProject.file('.tmp').absolutePath}", "-Djava.awt.headless=true"
	args = [project.findProperty("dir") ?: "", project.findProperty("ref") ?: ""]
}
